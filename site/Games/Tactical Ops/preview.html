<!doctype html><html><head><meta charset="utf-8"><title>Tactical Ops preview</title><style>/* standalone preview only: transparency grid */html{background:repeating-conic-gradient(#d9d9d9 0 25%,#fff 0 50%) 0 0/28px 28px}</style><style>/* Tactical Ops — paste ALL of this into the CSS tab of the same Custom Widget.
   Unofficial, fan-made style inspired by Counter-Strike. Not affiliated with or endorsed by its makers.
   Colours can be changed on the overlay site or in the Fields panel. These are the defaults. */
@import url('https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira+Condensed:wght@500;600;700;800&display=swap');
:root{
  --accent: #f0b429; /* @color HUD yellow */
  --text: #f1f1ee; /* @color Text */
  --cam-border: #f0b429; /* @color Webcam border */
  --nameplate-bg: #101318f0; /* @color Name plate */
  --alert-bg: #101318e6; /* @color Alert box */
  --chat-bg: #101318cc; /* @color Chat messages */
  --chat-name: #8fb3ff; /* @color Chat names (no Twitch colour) */
  --stat-bg: #101318d9; /* @color Latest boxes */
  --goal-fill: #f0b429; /* @color Goal bar */
  --team: #5d79ae; /* @color Team colour */
  --steel: #3b424c; /* @color Steel plates */
  --game-frame: #f0b429; /* @color Game window frame */
  --font-body: 'Saira Condensed',Arial,sans-serif;
  --font-display: 'Saira Stencil One',Impact,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
.ov{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left;pointer-events:none;
  font-family:var(--font-body);color:var(--text)}
.cam,.alert,.chat,.latest,.socials{position:absolute}
.box,.cam,.chat{isolation:isolate}
.cam{--ring:14px}
.cam-hole{position:absolute;inset:0}
.nameplate{position:absolute;z-index:4;white-space:nowrap}
/* Chat: hidden while empty, messages fade after chatSeconds */
.chat{opacity:0;transition:opacity .35s;display:flex;flex-direction:column}
.chat.active{opacity:1}
.chat-title>span{position:relative}
.chat-list{display:flex;flex-direction:column;justify-content:flex-end;gap:8px;overflow:hidden;min-height:0}
.msg{flex-shrink:0;overflow-wrap:anywhere;animation:msgIn .35s ease-out both;background:var(--chat-bg)}
.msg.leaving{opacity:0;transform:translateY(-6px);transition:opacity .5s,transform .5s}
.msg-head{display:flex;align-items:center;gap:6px;min-width:0}
.msg-user{color:var(--user-colour,var(--chat-name));font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-badges img{height:18px;vertical-align:middle;margin-right:2px}
.msg-role{font-size:.62em;font-weight:800;letter-spacing:.08em;padding:2px 5px;background:var(--accent);color:var(--on-accent,#fff);border-radius:3px}
.msg-body{color:var(--text)}
.msg-body img.emote{height:1.6em;vertical-align:middle}
.msg.action .msg-body{font-style:italic}
/* Alerts: hidden until .show */
.alert{display:flex;align-items:center;gap:18px;opacity:0;background:var(--alert-bg);color:var(--text)}
.alert.show{animation:alertIn .55s cubic-bezier(.2,1.2,.3,1) forwards}
.alert.hide{animation:alertOut .5s ease forwards}
.alert-icon{flex:0 0 auto;display:grid;place-items:center}
.alert-copy{min-width:0;flex:1}
.alert-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Latest boxes */
.stat{position:relative;min-width:0;background:var(--stat-bg);color:var(--text)}
.stat label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-track{height:6px;background:var(--goal-track,#ffffff26);overflow:hidden;border-radius:6px;margin-top:8px}
#goal-fill{height:100%;width:0;background:var(--goal-fill);border-radius:inherit;transition:width .6s}
/* Extras (switched on in Show / hide, moved in the site's Edit mode) */
.socials,.extra-text,.extra-clock{position:absolute}
.extra-text{left:660px;top:24px;width:600px;text-align:center;padding:12px 20px;font-family:var(--font-display);font-size:30px;color:var(--text);background:var(--stat-bg)}
.extra-clock{right:48px;top:24px;padding:10px 18px;font-family:var(--font-display);font-size:34px;font-variant-numeric:tabular-nums;color:var(--text);background:var(--stat-bg)}
.socials.extra{left:48px;top:380px;width:360px;display:grid;gap:8px;padding:14px 16px;background:var(--stat-bg);color:var(--text)}
.socials.extra .social{display:flex;justify-content:space-between;gap:12px;white-space:nowrap}
.socials.extra em{font-style:normal;opacity:.75}
.socials.extra span{font-weight:700;overflow:hidden;text-overflow:ellipsis}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes alertIn{from{opacity:0;transform:translateY(-24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes alertOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-16px) scale(.97)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
/* ---- layout ---- */
.latest{left:48px;right:48px;top:32px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.cam{right:48px;bottom:48px;width:480px;height:300px}
.chat{left:48px;bottom:48px;width:420px;max-height:640px}
.alert{left:50%;top:168px;width:580px;margin-left:-290px}

/* ---- background image + game window (set in the Fields panel) ---- */
.ov>.bg-layer{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;pointer-events:none;
  background:center/cover no-repeat;-webkit-mask-size:1920px 1080px;mask-size:1920px 1080px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.ov.has-bg>.bg-layer{display:block}
.ov>.game-frame{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;pointer-events:none;
  -webkit-mask-size:1920px 1080px;mask-size:1920px 1080px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.ov>.game-frame>.game-box{position:absolute;box-shadow:0 0 0 3px var(--game-frame,#ffffff),0 0 0 4px #0009,0 12px 30px #000a}
.ov.has-bg.frame-on>.game-frame{display:block}
/* ---- show / hide switches ---- */
.ov.hide-chat .chat{display:none!important}
.ov.hide-alerts .alert{display:none!important}
.ov.hide-latest .latest{display:none!important}
.ov.hide-cam .cam{display:none!important}
.ov.hide-socials .socials{display:none!important}
.ov.hide-text .extra-text{display:none!important}
.ov.hide-clock .extra-clock{display:none!important}
/* ---- animations off (keeps alerts visible, just instant) ---- */
.ov.no-anim *,.ov.no-anim *::before,.ov.no-anim *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
/* ---- chat text size ---- */
.chat{zoom:var(--chat-zoom,1)}
/* ---- theme ---- */
.decor-screen{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;pointer-events:none}

.to-cr.tl{left:-9px;top:-9px;border-right:0;border-bottom:0}.to-cr.tr{right:-9px;top:-9px;border-left:0;border-bottom:0}
.to-cr.bl{left:-9px;bottom:-9px;border-right:0;border-top:0}.to-cr.br{right:-9px;bottom:-9px;border-left:0;border-top:0}

.to-tick.t{left:50%;top:-12px;width:3px;height:16px;margin-left:-1px}.to-tick.b{left:50%;bottom:-12px;width:3px;height:16px;margin-left:-1px}
.to-tick.l{top:50%;left:-12px;height:3px;width:16px;margin-top:-1px}.to-tick.r{top:50%;right:-12px;height:3px;width:16px;margin-top:-1px}
.to-plate{position:absolute;top:24px;bottom:24px;width:26px;background:linear-gradient(90deg,#596270,var(--steel) 40%,#22272e);border:1px solid #000;box-shadow:inset 0 1px 0 #ffffff33}

.alert-icon{display:none}

.msg-user::before{content:"(Team) ";color:var(--team);font-weight:600}
.msg-head{font:700 16px var(--font-body);letter-spacing:.04em}
.msg-role{background:var(--accent);color:#101318;border-radius:0}

.stat{padding:8px 14px 9px;border-bottom:3px solid var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px));
  background-image:linear-gradient(180deg,#ffffff0d,transparent)}

.goal-track{height:8px;border-radius:0;background:repeating-linear-gradient(90deg,#f1f1ee22 0 7px,transparent 7px 9px)}
#goal-fill{border-radius:0;background:repeating-linear-gradient(90deg,var(--goal-fill) 0 7px,transparent 7px 9px)}

@keyframes tacticalops-blink{0%{opacity:1}50%{opacity:.25}}@keyframes tacticalops-sweep{to{transform:rotate(360deg)}}@keyframes tacticalops-aim{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(45deg) scale(.86)}}

@keyframes sx-up{to{transform:translateY(-104%)}}

  function chat() { var c = chats[ci++ % chats.length]; n++; emit('message', { data: { displayName: c[0], nick: c[0].toLowerCase(), text: c[1], displayColor: c[2], msgId: 'demo' + n, userId: 'u' + (ci % chats.length), badges: c[3].map(function (t) { return { type: t, url: '' }; }), emotes: [] } }); }
  function alertNext() { var a = alerts[ai++ % alerts.length]; emit(a[0], a[1]); }
  setTimeout(chat, 300); setTimeout(chat, 1100); setTimeout(chat, 2000); setTimeout(alertNext, 900);
  setInterval(chat, 2600); setInterval(alertNext, 8000);

  /* ---- Edit mode (overlay site only): drag parts and the game window, resize the webcam / chat / boxes ---- */
  var ed = { on: false, root: null, layer: null, boxes: {}, drag: null, lock: true, names: {}, timer: null, sel: null };
  var RESIZE = { cam: 1, chat: 1, latest: 1, alerts: 1, text: 1, socials: 1, game: 1 };
  var es = document.createElement('style');
  es.textContent = '.ov-editing .alert{opacity:1!important;animation:none!important}.ov-editing .chat{opacity:1!important}' +
    '.ov-editing>.game-frame{display:block!important}.ov-editing [data-game-hole]{outline:2px dashed rgba(255,255,255,.7);outline-offset:-2px}' +
    '.ed-layer{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:2147483000;pointer-events:none;font:600 20px Arial,sans-serif}' +
    '.ed-box{position:absolute;pointer-events:auto;cursor:move;outline:3px dashed #3cf;outline-offset:-2px;background:rgba(51,204,255,.08);touch-action:none}' +
    '.ed-box{z-index:2}.ed-box.game{z-index:1;outline-color:#fc3;background:rgba(255,204,51,.05)}.ed-box.sel{z-index:3}.ed-box.sel{outline-style:solid;background:rgba(51,204,255,.16)}' +
    '.ed-box b{position:absolute;left:-3px;top:-34px;padding:4px 10px;background:#3cf;color:#012;white-space:nowrap;border-radius:4px 4px 0 0}' +
    '.ed-box.game b{background:#fc3;top:0;left:0;border-radius:0 0 4px 0}' +
    '.ed-box i{position:absolute;right:-12px;bottom:-12px;width:24px;height:24px;background:#3cf;border:3px solid #012;border-radius:50%;cursor:nwse-resize}.ed-box.game i{background:#fc3}';
  document.head.appendChild(es);
  function edRoot() { var b = document.querySelector('.bg-layer'); return b && b.parentElement; }
  function scaleOf(root) { var r = root.getBoundingClientRect(); return (r.width / root.offsetWidth) || 1; }
  function partEl(k) { return k === 'game' ? ed.root.querySelector('.game-box') : ed.root.querySelector('[data-part="' + k + '"]'); }
  function visible(el) { return el && el.offsetWidth > 0 && getComputedStyle(el).display !== 'none'; }
  function rectOf(el) {   // position in the overlay's own 1920x1080 pixels
    var R = ed.root.getBoundingClientRect(), r = el.getBoundingClientRect(), s = scaleOf(ed.root);
    return [Math.round((r.left - R.left) / s), Math.round((r.top - R.top) / s), Math.round(r.width / s), Math.round(r.height / s)];
  }
  function sync() {
    if (!ed.on) return;
    var keys = Array.prototype.map.call(ed.root.querySelectorAll('[data-part]'), function (e) { return e.getAttribute('data-part'); });
    keys.push('game');
    keys.forEach(function (k) {
      var el = partEl(k), box = ed.boxes[k];
      if (!visible(el)) { if (box) box.style.display = 'none'; return; }
      if (!box) {
        box = ed.boxes[k] = document.createElement('div'); box.className = 'ed-box' + (k === 'game' ? ' game' : ''); box.tabIndex = 0;
        box.setAttribute('role', 'button'); box.setAttribute('aria-label', 'Move ' + (ed.names[k] || k) + ' (arrow keys nudge, Shift for 10px)');
        var b = document.createElement('b'); b.textContent = ed.names[k] || k; box.appendChild(b);
        if (RESIZE[k]) { var h = document.createElement('i'); h.title = 'Drag to resize'; box.appendChild(h); }
        box.addEventListener('pointerdown', function (e) { start(e, k, e.target.tagName === 'I'); });
        box.addEventListener('keydown', function (e) { nudge(e, k); });
        box.addEventListener('focus', function () { select(k); });
        ed.layer.appendChild(box);
      }
      var r = rectOf(el);
      box.style.display = ''; box.style.left = r[0] + 'px'; box.style.top = r[1] + 'px'; box.style.width = r[2] + 'px'; box.style.height = r[3] + 'px';
    });
  }
  function select(k) { ed.sel = k; Object.keys(ed.boxes).forEach(function (n) { ed.boxes[n].classList.toggle('sel', n === k); }); }
  function place(k, el, x, y, w, h) {
    if (k === 'game') { Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }); return; }
    Object.assign(el.style, { left: x + 'px', top: y + 'px', right: 'auto', bottom: 'auto', marginLeft: '0px', marginTop: '0px', width: w + 'px' });
    if (h) { el.style.height = h + 'px'; el.style.maxHeight = h + 'px'; }
  }
  function start(e, k, resize) {
    e.preventDefault(); e.stopPropagation(); select(k);
    var el = partEl(k); if (!el) return;
    var off = k === 'game' ? [el.offsetLeft, el.offsetTop] : [el.offsetLeft, el.offsetTop];
    ed.drag = { k: k, el: el, resize: resize, sx: e.clientX, sy: e.clientY, x: off[0], y: off[1], w: el.offsetWidth, h: el.offsetHeight,
      setH: resize || !!el.style.height, s: scaleOf(ed.root), id: e.pointerId, box: ed.boxes[k] };
    try { ed.boxes[k].setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  addEventListener('pointermove', function (e) {
    var d = ed.drag; if (!d || e.pointerId !== d.id) return;
    var dx = (e.clientX - d.sx) / d.s, dy = (e.clientY - d.sy) / d.s;
    if (d.resize) {
      var w = clamp(Math.round(d.w + dx), 80, 1920), h = clamp(Math.round(d.h + dy), 40, 1080);
      if (d.k === 'game' && ed.lock) h = Math.round(w * 9 / 16);
      d.nw = w; d.nh = h; place(d.k, d.el, d.x, d.y, w, d.setH ? h : 0);
    } else {
      var x = Math.round(d.x + dx), y = Math.round(d.y + dy);
      if (e.shiftKey) { x = Math.round(x / 24) * 24; y = Math.round(y / 24) * 24; }     // hold Shift to snap to a 24px grid
      x = clamp(x, -200, 1900); y = clamp(y, -200, 1060);
      d.nx = x; d.ny = y; place(d.k, d.el, x, y, d.w, d.setH ? d.h : 0);
    }
    sync();
  });
  function finish(k, el, setH) {
    var msg = { scope: 'overlay-demo', action: k === 'game' ? 'game-moved' : 'part-moved', part: k,
      rect: [el.offsetLeft, el.offsetTop, el.offsetWidth, setH ? el.offsetHeight : 0] };
    try { parent.postMessage(msg, '*'); } catch (err) { /* ignore */ }
  }
  function end(e) { var d = ed.drag; if (!d || e.pointerId !== d.id) return; ed.drag = null; if (d.nx != null || d.nw != null) finish(d.k, d.el, d.setH); }
  addEventListener('pointerup', end); addEventListener('pointercancel', end);
  function nudge(e, k) {
    var m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key]; if (!m) return;
    e.preventDefault(); var el = partEl(k); if (!el) return; var n = e.shiftKey ? 10 : 1;
    place(k, el, el.offsetLeft + m[0] * n, el.offsetTop + m[1] * n, el.offsetWidth, el.style.height ? el.offsetHeight : 0);
    sync(); clearTimeout(ed.nt); ed.nt = setTimeout(function () { finish(k, el, !!el.style.height); }, 250);
  }
  function setEdit(on, opts) {
    ed.root = edRoot(); if (!ed.root) return;
    ed.on = !!on; ed.lock = !opts || opts.lock !== false; ed.names = (opts && opts.names) || ed.names;
    ed.root.classList.toggle('ov-editing', ed.on);
    if (ed.on && !ed.layer) { ed.layer = document.createElement('div'); ed.layer.className = 'ed-layer'; ed.root.appendChild(ed.layer); }
    if (ed.layer) ed.layer.style.display = ed.on ? '' : 'none';
    clearInterval(ed.timer);
    if (ed.on) { var a = document.getElementById('alert-name'); if (a && !a.textContent) { a.textContent = 'NewFriend'; } sync(); ed.timer = setInterval(function () { if (!ed.drag) sync(); }, 150); }
  }
  addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.scope !== 'overlay-demo') return;
    if (d.action === 'vars' && d.vars) Object.keys(d.vars).forEach(function (k) { if (/^--[\w-]+$/.test(k)) document.documentElement.style.setProperty(k, d.vars[k]); });
    if (d.action === 'text' && d.fields) Object.keys(d.fields).forEach(function (k) { document.querySelectorAll('[data-field="' + k.replace(/[^\w-]/g, '') + '"]').forEach(function (el) { el.textContent = d.fields[k]; }); });
    if (d.action === 'fields' && d.fieldData && typeof d.fieldData === 'object') load(d.fieldData);
    if (d.action === 'edit') setEdit(d.on, d);
    if (d.action === 'alert') alertNext();
    if (d.action === 'chat') chat();
    if (d.action === 'chat-line' && typeof d.text === 'string') { n++; emit('message', { data: { displayName: String(d.name || 'You').slice(0, 32), nick: 'you', text: d.text.slice(0, 300), displayColor: '#FFD166', msgId: 'demo' + n, userId: 'you', badges: [{ type: 'broadcaster', url: '' }], emotes: [] } }); }
  });
})();
</script></body></html>
