<!-- Spec Ops HUD — paste ALL of this into the HTML tab of ONE StreamElements Custom Widget.
     The middle of the screen and the webcam hole are left completely empty (transparent). -->
<div id="ov" class="ov"><div class="bg-layer" aria-hidden="true"></div><div class="game-frame" aria-hidden="true"><div class="game-box" data-game-hole></div></div>
  <section id="cam" class="cam" aria-label="Webcam frame">
    <div class="so-frame"></div><div class="so-head"><span class="so-dot"></span><span>FEED //</span><span class="so-clock clock-time">00:00</span></div><i class="so-ret tl"></i><i class="so-ret tr"></i><i class="so-ret bl"></i><i class="so-ret br"></i>
    <div class="cam-hole" data-cam-hole></div>
    <div class="nameplate"><span data-field="name">Your cool name</span></div>
  </section>

  <section id="alert" class="alert box" aria-live="polite">
    <i class="so-track"></i>
    <div class="alert-icon" id="alert-icon"></div>
    <div class="alert-copy">
      <div class="alert-kind" id="alert-kind"></div>
      <div class="alert-name" id="alert-name"></div>
      <div class="alert-detail" id="alert-detail"></div>
    </div>
  </section>

  <section id="chat" class="chat" aria-label="Chat">
    
    <div class="chat-title"><span>SECURE COMMS</span></div>
    <div id="chat-list" class="chat-list"></div>
  </section>

  <section class="latest">
    <div class="stat box"><label>MILITIA ENLISTED //</label><strong data-latest="follower">—</strong></div>
    <div class="stat box"><label>NEW CONTRACTOR //</label><strong data-latest="subscriber">—</strong></div>
    <div class="stat box"><label>FUNDS RECEIVED //</label><strong data-latest="tip">—</strong></div>
    <div class="stat box"><label>TWITCH BITS ACQUIRED //</label><strong data-latest="cheer">—</strong></div>
    <div class="stat box"><label>SQUAD REINFORCEMENTS //</label><strong data-latest="raid">—</strong></div>
    <div class="stat goal box"><label>OBJECTIVE: FOLLOWERS //</label><strong id="goal-count">0 / 100</strong><div class="goal-track"><div id="goal-fill"></div></div></div>
  </section>
  <section class="socials box extra" aria-label="Socials">
    
    <div class="social"><em>YouTube</em><span data-field="youtube">@yourcoolname</span></div>
    <div class="social"><em>TikTok</em><span data-field="tiktok">@yourcoolname</span></div>
    <div class="social"><em>Twitch</em><span data-field="twitch">yourcoolname</span></div>
  </section>
  <section class="extra-text box extra" aria-label="Custom text"><span data-field="customText">20 KILLS</span></section>
  <section class="extra-clock box extra" aria-label="Clock"><span class="clock-time">00:00</span></section>
  <!-- scene-transition --><div class="sx" aria-hidden="true" style="--sx-a:var(--accent);--sx-b:#0a0c0f;--sx-c:var(--text)"><div class="sx-in"><i class="sx-gl r" style="top:0px;--d:0.51s"></i><i class="sx-gl l" style="top:90px;--d:0.48s"></i><i class="sx-gl r" style="top:180px;--d:0.55s"></i><i class="sx-gl l" style="top:270px;--d:0.49s"></i><i class="sx-gl r" style="top:360px;--d:0.47s"></i><i class="sx-gl l" style="top:450px;--d:0.55s"></i><i class="sx-gl r" style="top:540px;--d:0.68s"></i><i class="sx-gl l" style="top:630px;--d:0.65s"></i><i class="sx-gl r" style="top:720px;--d:0.64s"></i><i class="sx-gl l" style="top:810px;--d:0.51s"></i><i class="sx-gl r" style="top:900px;--d:0.58s"></i><i class="sx-gl l" style="top:990px;--d:0.52s"></i><i class="sx-scan"></i><b class="sx-name" data-field="name">Your cool name</b></div></div><!-- /scene-transition -->
</div>
