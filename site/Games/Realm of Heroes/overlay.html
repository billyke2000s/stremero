<!-- Realm of Heroes — paste ALL of this into the HTML tab of ONE StreamElements Custom Widget.
     The middle of the screen and the webcam hole are left completely empty (transparent). -->
<div id="ov" class="ov"><div class="bg-layer" aria-hidden="true"></div><div class="game-frame" aria-hidden="true"><div class="game-box" data-game-hole></div></div>
  <section id="cam" class="cam" aria-label="Webcam frame">
    <i class="rh-stone"></i><svg class="rh-boss tl" viewBox="0 0 60 60" aria-hidden="true"><defs><radialGradient id="rh-g" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3c4"/><stop offset=".45" style="stop-color:var(--accent)"/><stop offset="1" stop-color="#5a3d0e"/></radialGradient><radialGradient id="rh-j" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffd1d1"/><stop offset=".5" style="stop-color:var(--gem)"/><stop offset="1" stop-color="#3a0606"/></radialGradient></defs><path d="M30 2 L38 12 L52 8 L48 22 L58 30 L48 38 L52 52 L38 48 L30 58 L22 48 L8 52 L12 38 L2 30 L12 22 L8 8 L22 12 Z" fill="url(#rh-g)" stroke="#2a1a06" stroke-width="1.5"/><circle cx="30" cy="30" r="10" fill="url(#rh-j)" stroke="#2a1a06" stroke-width="1.5"/></svg><svg class="rh-boss tr" viewBox="0 0 60 60" aria-hidden="true"><defs><radialGradient id="rh-g" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3c4"/><stop offset=".45" style="stop-color:var(--accent)"/><stop offset="1" stop-color="#5a3d0e"/></radialGradient><radialGradient id="rh-j" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffd1d1"/><stop offset=".5" style="stop-color:var(--gem)"/><stop offset="1" stop-color="#3a0606"/></radialGradient></defs><path d="M30 2 L38 12 L52 8 L48 22 L58 30 L48 38 L52 52 L38 48 L30 58 L22 48 L8 52 L12 38 L2 30 L12 22 L8 8 L22 12 Z" fill="url(#rh-g)" stroke="#2a1a06" stroke-width="1.5"/><circle cx="30" cy="30" r="10" fill="url(#rh-j)" stroke="#2a1a06" stroke-width="1.5"/></svg><svg class="rh-boss bl" viewBox="0 0 60 60" aria-hidden="true"><defs><radialGradient id="rh-g" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3c4"/><stop offset=".45" style="stop-color:var(--accent)"/><stop offset="1" stop-color="#5a3d0e"/></radialGradient><radialGradient id="rh-j" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffd1d1"/><stop offset=".5" style="stop-color:var(--gem)"/><stop offset="1" stop-color="#3a0606"/></radialGradient></defs><path d="M30 2 L38 12 L52 8 L48 22 L58 30 L48 38 L52 52 L38 48 L30 58 L22 48 L8 52 L12 38 L2 30 L12 22 L8 8 L22 12 Z" fill="url(#rh-g)" stroke="#2a1a06" stroke-width="1.5"/><circle cx="30" cy="30" r="10" fill="url(#rh-j)" stroke="#2a1a06" stroke-width="1.5"/></svg><svg class="rh-boss br" viewBox="0 0 60 60" aria-hidden="true"><defs><radialGradient id="rh-g" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff3c4"/><stop offset=".45" style="stop-color:var(--accent)"/><stop offset="1" stop-color="#5a3d0e"/></radialGradient><radialGradient id="rh-j" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffd1d1"/><stop offset=".5" style="stop-color:var(--gem)"/><stop offset="1" stop-color="#3a0606"/></radialGradient></defs><path d="M30 2 L38 12 L52 8 L48 22 L58 30 L48 38 L52 52 L38 48 L30 58 L22 48 L8 52 L12 38 L2 30 L12 22 L8 8 L22 12 Z" fill="url(#rh-g)" stroke="#2a1a06" stroke-width="1.5"/><circle cx="30" cy="30" r="10" fill="url(#rh-j)" stroke="#2a1a06" stroke-width="1.5"/></svg><svg class="rh-crest" viewBox="0 0 120 110" aria-hidden="true"><defs><linearGradient id="rh-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8e8ee"/><stop offset="1" stop-color="#7a7d88"/></linearGradient><linearGradient id="rh-g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".5" style="stop-color:var(--accent)"/><stop offset="1" stop-color="#6b4e1a"/></linearGradient></defs><path d="M14 14 L106 96 M106 14 L14 96" stroke="url(#rh-s)" stroke-width="8" stroke-linecap="round"/><path d="M8 8 h14 v6 h-14z M98 8 h14 v6 h-14z" fill="url(#rh-g2)"/><path d="M60 10 L92 22 V54 Q92 84 60 102 Q28 84 28 54 V22 Z" fill="#3a0d12" stroke="url(#rh-g2)" stroke-width="6"/><path d="M60 26 L76 34 V54 Q76 72 60 84 Q44 72 44 54 V34 Z" fill="none" stroke="url(#rh-g2)" stroke-width="2.5" opacity=".9"/><path d="M60 38 L64 50 L76 50 L66 57 L70 69 L60 62 L50 69 L54 57 L44 50 L56 50 Z" fill="url(#rh-g2)"/></svg>
    <div class="cam-hole" data-cam-hole></div>
    <div class="nameplate"><span data-field="name">Your cool name</span></div>
  </section>

  <section id="alert" class="alert box" aria-live="polite">
    <i class="rh-roll l"></i><i class="rh-roll r"></i>
    <div class="alert-icon" id="alert-icon"></div>
    <div class="alert-copy">
      <div class="alert-kind" id="alert-kind"></div>
      <div class="alert-name" id="alert-name"></div>
      <div class="alert-detail" id="alert-detail"></div>
    </div>
  </section>

  <section id="chat" class="chat" aria-label="Chat">
    
    <div class="chat-title"><span>GUILD CHAT</span></div>
    <div id="chat-list" class="chat-list"></div>
  </section>

  <section class="latest">
    <div class="stat box"><label>Latest follower</label><strong data-latest="follower">—</strong></div>
    <div class="stat box"><label>Latest sub</label><strong data-latest="subscriber">—</strong></div>
    <div class="stat box"><label>Latest tip</label><strong data-latest="tip">—</strong></div>
    <div class="stat box"><label>Latest cheer</label><strong data-latest="cheer">—</strong></div>
    <div class="stat box"><label>Latest raid</label><strong data-latest="raid">—</strong></div>
    <div class="stat goal box"><label>Follower goal</label><strong id="goal-count">0 / 100</strong><div class="goal-track"><div id="goal-fill"></div></div></div>
  </section>
  <section class="socials box extra" aria-label="Socials">
    
    <div class="social"><em>YouTube</em><span data-field="youtube">@yourcoolname</span></div>
    <div class="social"><em>TikTok</em><span data-field="tiktok">@yourcoolname</span></div>
    <div class="social"><em>Twitch</em><span data-field="twitch">yourcoolname</span></div>
  </section>
  <section class="extra-text box extra" aria-label="Custom text"><span data-field="customText">Your text here</span></section>
  <section class="extra-clock box extra" aria-label="Clock"><span class="clock-time">00:00</span></section>
  <!-- scene-transition --><div class="sx" aria-hidden="true" style="--sx-a:var(--accent);--sx-b:var(--nameplate-bg);--sx-c:var(--text)"><div class="sx-in"><i class="sx-cur l" style="--d:.5s"></i><i class="sx-cur r" style="--d:.5s"></i><b class="sx-name" data-field="name">Your cool name</b></div></div><!-- /scene-transition -->
</div>
