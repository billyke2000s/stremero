<!doctype html><html><head><meta charset="utf-8"><title>Imperial Jade preview</title><style>/* standalone preview only: transparency grid */html{background:repeating-conic-gradient(#d9d9d9 0 25%,#fff 0 50%) 0 0/28px 28px}</style><style>/* Imperial Jade — paste ALL of this into the CSS tab of the same Custom Widget.
   Colours can be changed on the overlay site or in the Fields panel. These are the defaults. */
@import url('https://fonts.googleapis.com/css2?family=Marcellus&family=Cinzel:wght@700&display=swap');
:root{
  --metal: #d9b04c; /* @color Metal */
  --metal-hi: #fff4c2; /* @color Metal highlight */
  --metal-lo: #6a4b0f; /* @color Metal shadow */
  --bead: #e8f5e0; /* @color Pearls & beads */
  --jewel: #1f9d63; /* @color Jewels */
  --jewel-hi: #b6f5d2; /* @color Jewel sparkle */
  --jewel-2: #c0192f; /* @color Second jewels */
  --velvet: #0c3324; /* @color Velvet panels */
  --velvet-hi: #1f6b4a; /* @color Velvet sheen */
  --text: #fbf6e4; /* @color Text */
  --accent: #f5d06a; /* @color Titles */
  --chat-bg: #07261ae6; /* @color Chat messages */
  --chat-name: #f5d06a; /* @color Chat names (no Twitch colour) */
  --goal-fill: #1f9d63; /* @color Goal bar */
  --font-body: 'Marcellus',Georgia,serif;
  --font-display: 'Cinzel',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
.ov{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:top left;pointer-events:none;
  font-family:var(--font-body);color:var(--text)}
.cam,.alert,.chat,.latest,.socials{position:absolute}
.box,.cam,.chat{isolation:isolate}
.cam{--ring:14px}
.cam-hole{position:absolute;inset:0}
.nameplate{position:absolute;z-index:4;white-space:nowrap}
/* Chat: hidden while empty, messages fade after chatSeconds */
.chat{opacity:0;transition:opacity .35s;display:flex;flex-direction:column}
.chat.active{opacity:1}
.chat-title>span{position:relative}
.chat-list{display:flex;flex-direction:column;justify-content:flex-end;gap:8px;overflow:hidden;min-height:0}
.msg{flex-shrink:0;overflow-wrap:anywhere;animation:msgIn .35s ease-out both;background:var(--chat-bg)}
.msg.leaving{opacity:0;transform:translateY(-6px);transition:opacity .5s,transform .5s}
.msg-head{display:flex;align-items:center;gap:6px;min-width:0}
.msg-user{color:var(--user-colour,var(--chat-name));font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-badges img{height:18px;vertical-align:middle;margin-right:2px}
.msg-role{font-size:.62em;font-weight:800;letter-spacing:.08em;padding:2px 5px;background:var(--accent);color:var(--on-accent,#fff);border-radius:3px}
.msg-body{color:var(--text)}
.msg-body img.emote{height:1.6em;vertical-align:middle}
.msg.action .msg-body{font-style:italic}
/* Alerts: hidden until .show */
.alert{display:flex;align-items:center;gap:18px;opacity:0;background:var(--alert-bg);color:var(--text)}
.alert.show{animation:alertIn .55s cubic-bezier(.2,1.2,.3,1) forwards}
.alert.hide{animation:alertOut .5s ease forwards}
.alert-icon{flex:0 0 auto;display:grid;place-items:center}
.alert-copy{min-width:0;flex:1}
.alert-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Latest boxes */
.stat{position:relative;min-width:0;background:var(--stat-bg);color:var(--text)}
.stat label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-track{height:6px;background:var(--goal-track,#ffffff26);overflow:hidden;border-radius:6px;margin-top:8px}
#goal-fill{height:100%;width:0;background:var(--goal-fill);border-radius:inherit;transition:width .6s}
/* Extras (switched on in Show / hide, moved in the site's Edit mode) */
.socials,.extra-text,.extra-clock{position:absolute}
.extra-text{left:660px;top:24px;width:600px;text-align:center;padding:12px 20px;font-family:var(--font-display);font-size:30px;color:var(--text);background:var(--stat-bg)}
.extra-clock{right:48px;top:24px;padding:10px 18px;font-family:var(--font-display);font-size:34px;font-variant-numeric:tabular-nums;color:var(--text);background:var(--stat-bg)}
.socials.extra{left:48px;top:380px;width:360px;display:grid;gap:8px;padding:14px 16px;background:var(--stat-bg);color:var(--text)}
.socials.extra .social{display:flex;justify-content:space-between;gap:12px;white-space:nowrap}
.socials.extra em{font-style:normal;opacity:.75}
.socials.extra span{font-weight:700;overflow:hidden;text-overflow:ellipsis}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes alertIn{from{opacity:0;transform:translateY(-24px) scale(.94)}to{opacity:1;transform:none}}
@keyframes alertOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-16px) scale(.97)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
/* ---- layout ---- */
.cam{left:72px;top:92px;width:480px;height:300px}
.alert{left:50%;top:40px}
.chat{right:72px;bottom:160px;width:440px;max-height:620px}
.latest{left:72px;right:72px;bottom:36px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}

/* ---- background image + game window (set in the Fields panel) ---- */
.ov>.bg-layer{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;pointer-events:none;
  background:center/cover no-repeat;-webkit-mask-size:1920px 1080px;mask-size:1920px 1080px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.ov.has-bg>.bg-layer{display:block}
.ov>.game-frame{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;pointer-events:none;
  -webkit-mask-size:1920px 1080px;mask-size:1920px 1080px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.ov>.game-frame>.game-box{position:absolute;box-shadow:0 0 0 3px var(--game-frame,#ffffff),0 0 0 4px #0009,0 12px 30px #000a}
.ov.has-bg.frame-on>.game-frame{display:block}
/* ---- show / hide switches ---- */
.ov.hide-chat .chat{display:none!important}
.ov.hide-alerts .alert{display:none!important}
.ov.hide-latest .latest{display:none!important}
.ov.hide-cam .cam{display:none!important}
.ov.hide-socials .socials{display:none!important}
.ov.hide-text .extra-text{display:none!important}
.ov.hide-clock .extra-clock{display:none!important}
/* ---- animations off (keeps alerts visible, just instant) ---- */
.ov.no-anim *,.ov.no-anim *::before,.ov.no-anim *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
/* ---- chat text size ---- */
.chat{zoom:var(--chat-zoom,1)}
/* ---- theme ---- */
.ov{--alert-bg:transparent;--stat-bg:transparent;--nameplate-bg:transparent;--on-accent:#1a1206;
  --metal-text:linear-gradient(180deg,var(--metal-hi) 0%,var(--metal) 45%,var(--metal-lo) 52%,var(--metal-hi) 80%,var(--metal) 100%)}
.orn{position:absolute;overflow:visible;pointer-events:none}
.screen-orn{left:0;top:0;filter:drop-shadow(0 6px 8px #000c)}
/* the frame's panels cover the webcam corners on shaped holes; the hole itself is empty */
.cam{--ring:22px;--bw:18px}
.cam-orn{filter:drop-shadow(0 3px 3px #000c)}
.nameplate{left:50%;top:296px;width:340px;height:60px;margin-left:-170px;display:grid;place-items:center;z-index:6;
  filter:drop-shadow(0 6px 8px #000c)}
.nameplate span{position:relative;z-index:1;max-width:270px;overflow:hidden;text-overflow:ellipsis;font:700 24px var(--font-display);
  background:var(--metal-text);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 1px #000)}
.plate-orn{left:0;top:0}
.spark{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;z-index:7;background:radial-gradient(circle,#fff 0 18%,transparent 20%),
  linear-gradient(0deg,transparent 45%,#fff 50%,transparent 55%),linear-gradient(90deg,transparent 45%,#fff 50%,transparent 55%);
  animation:spark 4s ease-in-out infinite;opacity:0;will-change:transform,opacity}
@keyframes spark{0%,70%,100%{opacity:0;transform:scale(.2) rotate(0)}80%{opacity:1;transform:scale(1) rotate(45deg)}90%{opacity:0;transform:scale(.4) rotate(90deg)}}
/* alert cartouche */
.alert{width:700px;height:156px;margin-left:-350px;padding:0 70px 0 64px;gap:18px;filter:drop-shadow(0 12px 16px #000c)}
.alert-orn{left:0;top:0;z-index:0}
.alert-icon,.alert-copy{position:relative;z-index:2}
.alert-icon{width:64px;height:64px;border-radius:50%;font-size:28px;color:var(--jewel-hi);background:radial-gradient(circle at 35% 30%,var(--jewel-hi),var(--jewel) 45%,#000 100%);
  box-shadow:0 0 0 3px var(--metal),0 0 0 5px var(--metal-lo),0 0 0 7px var(--metal-hi),0 0 22px var(--jewel);text-shadow:0 0 6px #fff}
.alert-icon{color:#fff}
.alert-kind{font:700 13px var(--font-display);letter-spacing:.32em;color:var(--accent);text-shadow:0 1px 2px #000}
.alert-name{font:700 34px/1.2 var(--font-display);background:var(--metal-text);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 1px #000)}
.alert-detail{font-size:19px;color:var(--text);text-shadow:0 1px 3px #000}
.alert.show{animation:ornIn .8s cubic-bezier(.2,1.1,.3,1) forwards}
@keyframes ornIn{from{opacity:0;transform:translateY(-18px) scale(.9)}to{opacity:1;transform:none}}
/* chat */
.chat-title{position:relative;align-self:flex-end;width:300px;height:48px;display:grid;place-items:center;margin-bottom:8px;
  font:700 15px var(--font-display);letter-spacing:.24em;color:var(--accent);text-shadow:0 1px 2px #000;filter:drop-shadow(0 4px 6px #000b)}
.chat>.orn{display:none}
.msg{position:relative;padding:11px 18px 11px 30px;border-radius:6px;font-size:19px;color:var(--text);
  background:radial-gradient(ellipse at 30% 0,#ffffff14,transparent 60%),var(--chat-bg);
  box-shadow:inset 0 0 0 1px var(--metal-lo),inset 0 0 0 3px var(--metal),inset 0 0 0 4px var(--metal-hi),inset 0 0 0 5px var(--metal-lo),0 6px 14px #000b}
.msg::before{content:"";position:absolute;left:9px;top:50%;width:11px;height:11px;margin-top:-6px;transform:rotate(45deg);

.msg-user{font-family:var(--font-display);font-size:16px;letter-spacing:.04em}
.msg-role{background:var(--metal-text);color:#1a1206}

.stat{height:88px;padding:17px 30px 0}
.stat>.orn{left:0;top:0;z-index:0}
.stat label,.stat strong,.goal-track{position:relative;z-index:2}
.stat label{font:700 11px var(--font-display);letter-spacing:.2em;color:var(--accent);text-transform:uppercase;text-align:center;text-shadow:0 1px 2px #000}
.stat strong{font:700 18px var(--font-display);margin-top:5px;text-align:center;color:var(--text);text-shadow:0 2px 3px #000}
.goal-track{height:8px;margin:6px 8px 0;background:#0009;box-shadow:0 0 0 1px var(--metal-lo),0 0 0 2px var(--metal)}

.soc-orn{left:0;top:0;z-index:0}
.social{position:relative;z-index:2;display:flex;align-items:baseline;gap:14px;height:46px;border-bottom:1px solid #ffffff1f}

.spin-slow{animation:spin 24s linear infinite}.spin-rev{animation:spin 16s linear infinite reverse}

<script>/* ===================================================================
   IMPERIAL JADE — StreamElements Custom Widget (JS tab)
   Paste ALL of this into the JS tab. No API keys or libraries needed.

   Handles: fading chat (emotes, badges, mod deletions/bans), queued
   follow / sub / resub / gift / community-gift / bits / tip / raid
   alerts, latest-event boxes and a follower goal.

   Settings: paste the "Fields" box from the overlay site into the widget's
   FIELDS tab. Then colours, your name, background image, sounds, filters and
   show/hide switches can all be changed in StreamElements without code.
   The values below are only used if a setting is missing.
   ================================================================= */
(() => {
  'use strict';
  const CONFIG = {
    chatSeconds: 10,      // seconds before a chat message fades out
    maxMessages: 5,       // most chat messages on screen at once
    alertSeconds: 6,      // seconds each alert stays on screen
    followerGoal: 100,    // follower goal target
    minBits: 1,           // smallest cheer that triggers an alert
    minTip: 1,            // smallest tip that triggers an alert
    hideCommands: true,   // hide chat messages starting with !
    hiddenUsers: ['streamelements', 'nightbot', 'moobot', 'fossabot', 'streamlabs'], // lowercase
    useChatColours: true, // colour usernames with each chatter's Twitch colour
    hideLinks: false,     // hide chat messages that contain links
    minRaid: 1,           // smallest raid that triggers an alert
    alerts: { follower: true, subscriber: true, gift: true, cheer: true, tip: true, raid: true },
    alertSound: '',       // https link to a sound (set it in Fields: Alert sound)
    alertVolume: 50       // 0-100
  };
  const LABELS = {"follower": "NEW FOLLOWER", "subscriber": "NEW SUBSCRIBER", "gift": "GIFTED SUBS", "cheer": "CHEER", "tip": "TIP", "raid": "RAID", "followerText": "just followed!", "subText": "just subscribed", "resubText": "months subscribed", "giftText": "gifted by", "giftBombText": "subs gifted to the community!", "cheerText": "bits cheered!", "tipText": "tipped. Thank you!", "raidText": "raiders incoming!", "empty": "—", "host": "HOST", "mod": "MOD", "sub": "SUB"};

  const $ = id => document.getElementById(id);
  const root = $('ov');
  const chatBox = $('chat'), chatList = $('chat-list');
  const alertBox = $('alert');
  let currency = 'USD';
  const queue = [];
  let busy = false, showTimer = null, hideTimer = null;

  const num = v => (Number.isFinite(Number(v)) ? Math.max(0, Number(v)) : 0);
  const str = v => (v == null ? '' : String(v));
  const money = a => { try { return new Intl.NumberFormat(undefined, { style: 'currency', currency }).format(num(a)); } catch (e) { return num(a).toFixed(2); } };
  const setText = (el, t) => { if (el) el.textContent = t; };
  const tierName = t => ({ '1000': 'Tier 1', '2000': 'Tier 2', '3000': 'Tier 3', prime: 'Prime' })[str(t).toLowerCase()] || 'Tier 1';

  /* ---------- scale the 1920x1080 layout to the browser-source size ---------- */
  function fit() { if (root) root.style.transform = 'scale(' + (Math.min(innerWidth / 1920, innerHeight / 1080) || 1) + ')'; }
  addEventListener('resize', fit); fit();

  /* ---------- latest-event boxes + goal ---------- */
  function latest(type, ev) {
    if (!ev || !Object.prototype.hasOwnProperty.call(ev, 'name')) return;
    let t = str(ev.name) || LABELS.empty;
    if (ev.name && type === 'tip') t += ' · ' + money(ev.amount);
    if (ev.name && type === 'cheer') t += ' · ' + num(ev.amount) + ' bits';
    if (ev.name && type === 'raid') t += ' · ' + num(ev.amount);
    document.querySelectorAll('[data-latest="' + type + '"]').forEach(el => { el.textContent = t; });
  }
  function goal(count) {
    const target = Math.max(1, num(CONFIG.followerGoal));
    const c = num(count);
    setText($('goal-count'), c.toLocaleString() + ' / ' + target.toLocaleString());
    const fill = $('goal-fill'); if (fill) fill.style.width = Math.min(100, c / target * 100) + '%';
  }
  function session(data) {
    data = data || {};
    ['follower', 'subscriber', 'tip', 'cheer', 'raid'].forEach(t => latest(t, data[t + '-latest']));
    if (data['follower-total'] && data['follower-total'].count != null) goal(data['follower-total'].count);
  }

  /* ---------- chat (built with DOM nodes: chat can never inject HTML) ---------- */
  function removeMsg(node) { clearTimeout(node._t); node.remove(); if (chatBox) chatBox.classList.toggle('active', chatList.children.length > 0); }
  function addMessage(d) {
    d = d || {};
    const name = str(d.displayName || d.nick || 'viewer');
    const text = str(d.text).slice(0, 500);
    if (!text || !chatList) return;
    if (CONFIG.hiddenUsers.indexOf(str(d.nick || name).toLowerCase()) !== -1) return;
    if (CONFIG.hideCommands && text.charAt(0) === '!') return;
    if (CONFIG.hideLinks && /(https?:\/\/|www\.)\S+|\b[a-z0-9-]+\.(com|net|org|gg|tv|io|co|uk|me|ly|xyz)\b/i.test(text)) return;

    const msg = document.createElement('div');
    msg.className = 'msg' + (d.isAction ? ' action' : '');
    msg.dataset.msgId = str(d.msgId || (d.tags && d.tags.id));
    msg.dataset.userId = str(d.userId || (d.tags && d.tags['user-id']));
    if (CONFIG.useChatColours && /^#[0-9a-f]{6}$/i.test(str(d.displayColor))) msg.style.setProperty('--user-colour', d.displayColor);

    const head = document.createElement('div'); head.className = 'msg-head';
    const badges = (Array.isArray(d.badges) ? d.badges : []).filter(b => b && /^https:\/\//i.test(str(b.url)));
    if (badges.length) {
      const wrap = document.createElement('span'); wrap.className = 'msg-badges';
      badges.forEach(b => { const i = document.createElement('img'); i.src = b.url; i.alt = ''; i.referrerPolicy = 'no-referrer'; i.onerror = () => i.remove(); wrap.append(i); });
      head.append(wrap);
    }
    const user = document.createElement('span'); user.className = 'msg-user'; user.textContent = name; head.append(user);
    const types = (Array.isArray(d.badges) ? d.badges : []).map(b => b && b.type);
    const role = types.indexOf('broadcaster') !== -1 ? LABELS.host : types.indexOf('moderator') !== -1 ? LABELS.mod : types.indexOf('vip') !== -1 ? 'VIP' : types.indexOf('subscriber') !== -1 ? LABELS.sub : '';
    if (role) { const r = document.createElement('span'); r.className = 'msg-role'; r.textContent = role; head.append(r); }

    const body = document.createElement('div'); body.className = 'msg-body';
    // Emotes are placed by position, so emote names inside words are never touched.
    const emotes = (Array.isArray(d.emotes) ? d.emotes : [])
      .map(e => ({ s: Number(e.start), e: Number(e.end), url: str((e.urls && (e.urls['4'] || e.urls['2'] || e.urls['1'])) || e.gif) }))
      .filter(e => Number.isInteger(e.s) && Number.isInteger(e.e) && e.e >= e.s && e.e < text.length && /^https:\/\//i.test(e.url))
      .sort((a, b) => a.s - b.s);
    let cur = 0;
    emotes.forEach(e => {
      if (e.s < cur) return;
      body.append(document.createTextNode(text.slice(cur, e.s)));
      const img = document.createElement('img'); img.className = 'emote'; img.src = e.url; img.alt = text.slice(e.s, e.e + 1); img.referrerPolicy = 'no-referrer';
      img.onerror = () => img.replaceWith(document.createTextNode(img.alt));
      body.append(img); cur = e.e + 1;
    });
    body.append(document.createTextNode(text.slice(cur)));

    msg.append(head, body);
    chatList.append(msg);
    if (chatBox) chatBox.classList.add('active');
    while (chatList.children.length > CONFIG.maxMessages) removeMsg(chatList.firstElementChild);
    msg._t = setTimeout(() => { msg.classList.add('leaving'); msg._t = setTimeout(() => removeMsg(msg), 600); }, num(CONFIG.chatSeconds) * 1000);
  }

  /* ---------- alerts (queued, one at a time) ---------- */
  function enqueue(kind, icon, name, detail) {
    if (!CONFIG.alerts[kind]) return;
    if (queue.length >= 50) queue.shift();
    queue.push({ kind, icon, name, detail });
    if (!busy) next();
  }
  function next() {
    if (!queue.length || !alertBox) { busy = false; return; }
    busy = true;
    const a = queue.shift();
    alertBox.dataset.kind = a.kind;
    setText($('alert-kind'), LABELS[a.kind] || a.kind);
    setText($('alert-icon'), a.icon);
    setText($('alert-name'), a.name);
    setText($('alert-detail'), a.detail);
    alertBox.style.setProperty('--alert-seconds', CONFIG.alertSeconds + 's');
    alertBox.classList.remove('hide');
    void alertBox.offsetWidth; // restart CSS animations
    alertBox.classList.add('show');
    showTimer = setTimeout(finish, num(CONFIG.alertSeconds) * 1000);
    playSound();
  }
  function playSound() {
    if (!/^https:\/\//i.test(CONFIG.alertSound)) return;
    try { const a = new Audio(CONFIG.alertSound); a.volume = Math.max(0, Math.min(1, num(CONFIG.alertVolume) / 100)); const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* sound blocked or missing */ }
  }
  function finish() {
    clearTimeout(showTimer); clearTimeout(hideTimer);
    if (!busy) return;
    alertBox.classList.remove('show'); alertBox.classList.add('hide');
    hideTimer = setTimeout(() => { alertBox.classList.remove('hide'); next(); }, 600);
  }
  function alertFor(type, ev) {
    const who = str(ev.name) || 'Someone';
    if (type === 'follower') return enqueue('follower', '♥', who, LABELS.followerText);
    if (type === 'subscriber') {
      if (ev.bulkGifted) return enqueue('gift', '✦', str(ev.sender || ev.name) || 'Someone', num(ev.amount) + ' ' + LABELS.giftBombText);
      if (ev.isCommunityGift || ev.playedAsCommunityGift) return; // already covered by the community-gift alert
      if (ev.gifted) return enqueue('gift', '✦', who, LABELS.giftText + ' ' + (str(ev.sender) || 'Someone'));
      if (num(ev.amount) > 1) return enqueue('subscriber', '★', who, num(ev.amount) + ' ' + LABELS.resubText + ' · ' + tierName(ev.tier));
      return enqueue('subscriber', '★', who, LABELS.subText + ' · ' + tierName(ev.tier));
