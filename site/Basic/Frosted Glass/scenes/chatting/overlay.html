<!-- Frosted Glass — Just Chatting scene — paste ALL of this into the HTML tab of ONE StreamElements Custom Widget.
     The game window and the webcam hole are left completely empty (see-through). -->
<div id="ov" class="ov"><div class="bg-layer" aria-hidden="true"></div><div class="game-frame" aria-hidden="true"><div class="game-box" data-game-hole></div></div>
  <div class="el e-p1 k-cam src-frostedglass" data-el="p1" style="left:48px;top:176px;width:1216px;height:760px;z-index:1;"><div class="el-in" style="width:480px;height:300px;transform:scale(2.5333)"><section class="cam src-frostedglass" aria-label="Webcam frame"><div class="cam-hole" data-cam-hole></div><div class="nameplate"><span data-field="name">Your cool name</span></div></section></div></div>
  <div class="el e-p2 k-goal src-frostedglass" data-el="p2" style="left:1428px;top:820px;width:444px;height:116px;z-index:2;"><div class="el-in" style="width:296px;height:77.33px;transform:scale(1.5)"><section class="latest src-frostedglass"><div class="stat goal box"><label>Follower goal</label><strong id="goal-count">0 / 100</strong><div class="goal-track"><div id="goal-fill"></div></div></div></section></div></div>
  <div class="el e-p3 k-chat src-frostedglass" data-el="p3" style="left:1300px;top:176px;width:572px;height:616px;z-index:3;"><div class="el-in" style="width:497.39px;height:535.65px;transform:scale(1.15)"><section id="chat" class="chat src-frostedglass" aria-label="Chat"><div class="chat-title"><span>CHAT</span></div><div id="chat-list" class="chat-list"></div></section></div></div>
  <div class="el e-p4 k-alert src-frostedglass" data-el="p4" style="left:1306px;top:12px;width:560px;height:94px;z-index:4;"><div class="el-in" style="width:560px;height:94px;transform:scale(1)"><section id="alert" class="alert box src-frostedglass" aria-live="polite"><div class="alert-icon" id="alert-icon"></div><div class="alert-copy"><div class="alert-kind" id="alert-kind"></div><div class="alert-name" id="alert-name"></div><div class="alert-detail" id="alert-detail"></div></div></section></div></div>
<div class="sx" aria-hidden="true" style="--sx-a:var(--accent);--sx-b:#1d2433;--sx-c:var(--text)"><div class="sx-in"><i class="sx-band b1" style="--d:.45s"></i><i class="sx-band b2" style="--d:.52s"></i><i class="sx-band b3" style="--d:.59s"></i><b class="sx-name" data-field="name">Your cool name</b></div></div>
</div>
