<!-- Widow Silk — paste ALL of this into the HTML tab of ONE StreamElements Custom Widget.
     The middle of the screen and the webcam hole are left completely empty (transparent). -->
<div id="ov" class="ov"><div class="bg-layer" aria-hidden="true"></div><div class="game-frame" aria-hidden="true"><div class="game-box" data-game-hole></div></div><div class="decor-screen" aria-hidden="true"><div class="hw-scene-mark"><svg viewBox="0 0 180 180" aria-hidden="true"><g fill="none" stroke="#d6d0dc" stroke-width="2" opacity=".7"><path d="M0 0L180 0M0 0L166 69M0 0L127 127M0 0L69 166M0 0V180M40 0Q32 15 37 15Q25 25 28 28Q15 32 15 37Q0 32 0 40M85 0Q65 32 78 32Q55 55 60 60Q32 65 32 78Q0 65 0 85M135 0Q109 45 125 52Q90 90 95 95Q45 109 52 125Q0 109 0 135"/></g><path d="M125 52V103" stroke="#d6d0dc"/><ellipse cx="125" cy="110" rx="8" ry="11" fill="#d6d0dc"/><path d="M119 106L109 98M119 111L106 109M131 106L141 98M131 111L144 109M120 116L110 124M130 116L140 124" stroke="#d6d0dc" stroke-width="2"/></svg></div></div>
  <section id="cam" class="cam" aria-label="Webcam frame">
    <div class="hw-motif web"><svg viewBox="0 0 180 180" aria-hidden="true"><g fill="none" stroke="#d6d0dc" stroke-width="2" opacity=".7"><path d="M0 0L180 0M0 0L166 69M0 0L127 127M0 0L69 166M0 0V180M40 0Q32 15 37 15Q25 25 28 28Q15 32 15 37Q0 32 0 40M85 0Q65 32 78 32Q55 55 60 60Q32 65 32 78Q0 65 0 85M135 0Q109 45 125 52Q90 90 95 95Q45 109 52 125Q0 109 0 135"/></g><path d="M125 52V103" stroke="#d6d0dc"/><ellipse cx="125" cy="110" rx="8" ry="11" fill="#d6d0dc"/><path d="M119 106L109 98M119 111L106 109M131 106L141 98M131 111L144 109M120 116L110 124M130 116L140 124" stroke="#d6d0dc" stroke-width="2"/></svg></div>
    <div class="cam-hole" data-cam-hole></div>
    <div class="nameplate"><span data-field="name">Your cool name</span></div>
  </section>

  <section id="alert" class="alert box" aria-live="polite">
    
    <div class="alert-icon" id="alert-icon"></div>
    <div class="alert-copy">
      <div class="alert-kind" id="alert-kind"></div>
      <div class="alert-name" id="alert-name"></div>
      <div class="alert-detail" id="alert-detail"></div>
    </div>
  </section>

  <section id="chat" class="chat" aria-label="Chat">
    
    <div class="chat-title"><span>AFTER DARK</span></div>
    <div id="chat-list" class="chat-list"></div>
  </section>

  <section class="latest">
    <div class="stat box"><label>Latest follower</label><strong data-latest="follower">—</strong></div>
    <div class="stat box"><label>Latest sub</label><strong data-latest="subscriber">—</strong></div>
    <div class="stat box"><label>Latest tip</label><strong data-latest="tip">—</strong></div>
    <div class="stat box"><label>Latest cheer</label><strong data-latest="cheer">—</strong></div>
    <div class="stat box"><label>Latest raid</label><strong data-latest="raid">—</strong></div>
    <div class="stat goal box"><label>Follower goal</label><strong id="goal-count">0 / 100</strong><div class="goal-track"><div id="goal-fill"></div></div></div>
  </section>
  <section class="socials box extra" aria-label="Socials">
    
    <div class="social"><em>YouTube</em><span data-field="youtube">@yourcoolname</span></div>
    <div class="social"><em>TikTok</em><span data-field="tiktok">@yourcoolname</span></div>
    <div class="social"><em>Twitch</em><span data-field="twitch">yourcoolname</span></div>
  </section>
  <section class="extra-text box extra" aria-label="Custom text"><span data-field="customText">Your text here</span></section>
  <section class="extra-clock box extra" aria-label="Clock"><span class="clock-time">00:00</span></section>
  <!-- scene-transition --><div class="sx" aria-hidden="true" style="--sx-a:var(--accent);--sx-b:var(--nameplate-bg);--sx-c:var(--text)"><div class="sx-in"><i class="sx-band b1" style="--d:.45s"></i><i class="sx-band b2" style="--d:.52s"></i><i class="sx-band b3" style="--d:.59s"></i><b class="sx-name" data-field="name">Your cool name</b></div></div><!-- /scene-transition -->
</div>
