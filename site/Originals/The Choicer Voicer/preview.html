<!doctype html><html><head><meta charset="utf-8"><title>The Choicer Voicer preview</title><style>/* standalone preview only: transparency grid */html{background:repeating-conic-gradient(#d9d9d9 0 25%,#fff 0 50%) 0 0/28px 28px}</style><style>/* ===================================================================
   THE CHOICER VOICER — StreamElements Overlay  (CSS tab)
   Gameshow / studio-stage theme, tuned for Twitch legibility:
     • deep stage navy-purple that sits well over dark Twitch UI
     • warm "spotlight" gold for the studio identity
     • hot magenta accent so alerts genuinely catch the eye
     • high-contrast chat so viewers can actually read it
   ================================================================= */

@import url('https://fonts.googleapis.com/css2?family=Bungee&family=Poppins:wght@400;600;700&display=swap');

/* ---- Palette (edit here to re-theme) ---- */
:root{
  --stage-deep: #140a24; /* @color Stage dark */
  --stage-mid: #241246; /* @color Stage mid */
  --panel: #2a1550; /* @color Name plate */
  --gold: #ffc531; /* @color Gold trim */
  --gold-hot: #ffe486; /* @color Gold highlight */
  --magenta: #ff3d8b; /* @color Accent pink */
  --cyan: #3fe0ff; /* @color Accent cyan */
  --text: #ffffff; /* @color Text */
  --text-soft: #efe6ff; /* @color Soft text */
  --game-frame: #ffc531; /* @color Game window frame */


  /* Timing */
  --chat-life:8s;            /* time a chat msg stays before fading */
  --chat-fade:0.6s;
}

*{ box-sizing:border-box; margin:0; padding:0; }

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:'Poppins',sans-serif;
}

#cv-overlay{ position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:top left; }

/* ==================================================================
   CAMERA SLOT  (bottom-left) — place your OBS webcam over this frame
   ================================================================== */
#cam-slot{
  position:absolute;
  left:60px;
  top:70px;
  width:480px;
  height:340px;
}

.cam-frame{
  position:absolute;
  inset:0;
  border:6px solid var(--gold);
  border-radius:18px;
  background:transparent;                 /* transparent centre = cam shows through */
  box-shadow:
    0 0 0 4px var(--stage-deep),
    0 0 26px 5px rgba(255,197,49,.55),
    inset 0 0 22px rgba(0,0,0,.4);
}

/* Corner bolts */
.cam-corner{
  position:absolute;
  width:22px; height:22px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 35%, var(--gold-hot), var(--gold) 60%, #a9791a);
  box-shadow:0 0 10px var(--gold);
}
.cam-corner.tl{ top:-12px; left:-12px; }
.cam-corner.tr{ top:-12px; right:-12px; }
.cam-corner.bl{ bottom:-12px; left:-12px; }
.cam-corner.br{ bottom:-12px; right:-12px; }

/* Marquee lights across top of cam */
.cam-lights{
  position:absolute;
  top:-3px; left:14px; right:14px;
  display:flex; justify-content:space-between;
}
.cam-lights span{
  width:10px; height:10px; border-radius:50%;
  background:var(--gold-hot);
  box-shadow:0 0 8px var(--gold-hot);
  animation:blink 1.1s infinite;
}
.cam-lights span:nth-child(2){ animation-delay:.2s; }
.cam-lights span:nth-child(3){ animation-delay:.4s; }
.cam-lights span:nth-child(4){ animation-delay:.6s; }
.cam-lights span:nth-child(5){ animation-delay:.8s; }

@keyframes blink{
  0%,100%{ opacity:1;   transform:scale(1); }
  50%    { opacity:.25; transform:scale(.8); }
}

/* Nameplate under cam */
.cam-nameplate{
  position:absolute;
  left:50%; bottom:-26px;
  transform:translateX(-50%);
  display:flex; align-items:center; gap:8px;
  padding:8px 22px;
  background:linear-gradient(180deg,var(--panel),var(--stage-deep));
  border:3px solid var(--gold);
  border-radius:30px;
  box-shadow:0 4px 14px rgba(0,0,0,.55);
  white-space:nowrap;
}
.cam-mic{ font-size:20px; }
.cam-name{
  font-family:'Bungee',cursive;
  font-size:20px; letter-spacing:1px;
  color:var(--gold-hot);
  text-shadow:0 2px 0 #000;
}

/* ==================================================================
   CHAT  (right side) — high contrast, fades after --chat-life
   ================================================================== */
#chat-wrap{
  position:absolute;
  right:50px; bottom:110px;
  width:440px; max-height:720px;
  display:flex; flex-direction:column-reverse;   /* newest at bottom */
  overflow:hidden;
  pointer-events:none;
}
#chat-list{ display:flex; flex-direction:column; gap:12px; }

.chat-msg{
  position:relative;
  padding:12px 16px;
  background:linear-gradient(135deg, rgba(36,18,70,.94), rgba(20,10,36,.94));
  border-left:5px solid var(--magenta);
  border-radius:12px;
  box-shadow:0 4px 16px rgba(0,0,0,.5);
  color:var(--text);
  font-size:22px; line-height:1.35;
  word-wrap:break-word; overflow-wrap:anywhere;
  animation:
    msgIn .45s cubic-bezier(.2,.8,.2,1) both,
    msgOut var(--chat-fade) ease forwards;
  animation-delay:0s, var(--chat-life);
}
.chat-msg .chat-user{
  display:inline-flex; align-items:center; gap:6px;
  font-family:'Bungee',cursive; font-size:19px;
  margin-right:8px; vertical-align:baseline;
  color:var(--cyan);
}
.chat-msg .chat-badges img{
  height:20px; width:20px; vertical-align:middle; margin-right:2px;
}
.chat-msg .chat-text{ color:var(--text-soft); }
.chat-msg .chat-text img.emote{ height:26px; vertical-align:middle; }

@keyframes msgIn{
  from{ opacity:0; transform:translateX(60px) scale(.96); }
  to  { opacity:1; transform:translateX(0)    scale(1);  }
}
@keyframes msgOut{
  from{ opacity:1; transform:translateX(0); }
  to  { opacity:0; transform:translateX(40px); }
}

/* ==================================================================
   ALERT BOX  (top-centre) — followers / subs / bits / raids / tips
   ================================================================== */
#alert-box{
  position:absolute;
  top:70px; left:50%;
  transform:translateX(-50%) translateY(-40px);
  min-width:620px; max-width:820px;
  opacity:0; pointer-events:none;
}
#alert-box.show{ animation:alertPop .6s cubic-bezier(.16,1.2,.3,1) forwards; }
#alert-box.hide{ animation:alertOut .5s ease forwards; }

@keyframes alertPop{
  0%{ opacity:0; transform:translateX(-50%) translateY(-60px) scale(.8); }
  60%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1.04); }
  100%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
}
@keyframes alertOut{
  0%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  100%{ opacity:0; transform:translateX(-50%) translateY(-50px) scale(.9); }
}

.alert-inner{
  position:relative;
  display:flex; align-items:center; gap:20px;
  padding:22px 34px;
  background:linear-gradient(160deg,var(--stage-mid),var(--stage-deep));
  border:4px solid var(--gold);
  border-radius:20px;
  box-shadow:
    0 0 0 6px var(--stage-deep),
    0 12px 40px rgba(0,0,0,.65),
    0 0 44px rgba(255,61,139,.35);
  overflow:hidden;
}

/* Marquee lights along top edge */
.alert-lights{
  position:absolute;
  top:6px; left:20px; right:20px;
  display:flex; justify-content:space-between;
}
.alert-lights span{
  width:10px; height:10px; border-radius:50%;
  background:var(--gold-hot);
  box-shadow:0 0 8px var(--gold-hot);
  animation:blink 1s infinite;
}
.alert-lights span:nth-child(even){ animation-delay:.5s; }

.alert-badge{
  flex:0 0 auto;
  width:78px; height:78px;
  display:flex; align-items:center; justify-content:center;
  font-size:40px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold-hot), var(--gold) 60%, #a9791a);
  box-shadow:0 0 18px var(--gold), inset 0 -4px 10px rgba(0,0,0,.4);
  animation:spinPulse 2.2s ease-in-out infinite;
}
@keyframes spinPulse{
  0%,100%{ transform:scale(1) rotate(0); }
  50%    { transform:scale(1.08) rotate(8deg); }
}

.alert-text{ text-align:left; }
.alert-title{
  font-family:'Bungee',cursive;
  font-size:34px; line-height:1.1;
  color:var(--gold-hot);
  text-shadow:0 3px 0 #000, 0 0 18px rgba(255,197,49,.5);
}
.alert-title .hl{ color:var(--magenta); }
.alert-sub{
  margin-top:6px;
  font-size:22px; font-weight:600;
  color:var(--text-soft);
}
.alert-sub .hl{ color:var(--cyan); }

/* ---- background image + game window (set in the Fields panel) ---- */
#cv-overlay>.bg-layer{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;pointer-events:none;
  background:center/cover no-repeat;-webkit-mask-size:1920px 1080px;mask-size:1920px 1080px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#cv-overlay.has-bg>.bg-layer{display:block}
#cv-overlay>.game-frame{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none;pointer-events:none;
  -webkit-mask-size:1920px 1080px;mask-size:1920px 1080px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#cv-overlay>.game-frame>.game-box{position:absolute;box-shadow:0 0 0 3px var(--game-frame,#ffffff),0 0 0 4px #0009,0 12px 30px #000a}
#cv-overlay.has-bg.frame-on>.game-frame{display:block}
/* ---- show / hide switches ---- */
#cv-overlay.hide-chat #chat-wrap{display:none!important}
#cv-overlay.hide-alerts #alert-box{display:none!important}
#cv-overlay.hide-cam #cam-slot{display:none!important}
/* ---- animations off (keeps alerts visible, just instant) ---- */
#cv-overlay.no-anim *,#cv-overlay.no-anim *::before,#cv-overlay.no-anim *::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
/* ---- chat text size ---- */
#chat-wrap{zoom:var(--chat-zoom,1)}
/* >>> scene transition */
/* ---- scene transition: plays once when the scene appears (switch it off with "Show scene transition") ---- */
.sx{position:absolute;left:0;top:0;width:0;height:0;overflow:visible;z-index:2147480000;pointer-events:none}
.sx-in{--d:1.7s;position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;animation:sx-gone .01s linear 1.7s forwards}
.sx .sx-in *{position:absolute;animation-delay:var(--d,0s)}
.sx-name{left:0;right:0;top:50%;margin-top:-50px;height:100px;line-height:100px;text-align:center;white-space:nowrap;overflow:hidden;
  font-family:var(--font-display,Impact,Arial,sans-serif);font-size:76px;letter-spacing:.06em;text-transform:uppercase;color:var(--sx-c);
  text-shadow:0 4px 16px rgba(0,0,0,.45);animation:sx-name .9s ease forwards;z-index:5;--d:0s}
.hide-transition .sx{display:none!important}
@keyframes sx-gone{to{visibility:hidden}}
@keyframes sx-name{0%,40%{opacity:1;transform:scale(1)}65%,100%{opacity:0;transform:scale(1.08)}}

.sx-cur{top:0;bottom:0;width:51%;animation:sx-cur-l .85s cubic-bezier(.65,0,.35,1) forwards;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 22px,transparent 22px 48px,rgba(0,0,0,.35) 48px 74px,transparent 74px 96px),var(--sx-b)}
.sx-cur.l{left:0;box-shadow:inset -12px 0 0 var(--sx-a),inset -16px 0 0 rgba(0,0,0,.5)}
.sx-cur.r{right:0;animation-name:sx-cur-r;box-shadow:inset 12px 0 0 var(--sx-a),inset 16px 0 0 rgba(0,0,0,.5)}
@keyframes sx-cur-l{to{transform:translateX(-104%)}}
@keyframes sx-cur-r{to{transform:translateX(104%)}}
/* <<< scene transition */

     Paste this into the "HTML" tab of a StreamElements Overlay widget.
     Put the CSS in the "CSS" tab and the JS in the "JS" tab.
     ================================================================= -->

<div id="cv-overlay">

  <!-- ===================== CAMERA SLOT ===================== -->
  <!-- Position your webcam SOURCE on top of this frame in OBS.       -->
  <!-- The frame is transparent in the middle so your cam shows through. -->
  <div id="cam-slot">
    <div class="cam-frame">
      <div class="cam-corner tl"></div>
      <div class="cam-corner tr"></div>
      <div class="cam-corner bl"></div>
      <div class="cam-corner br"></div>
      <div class="cam-lights">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
    <div class="cam-nameplate">
      <span class="cam-mic">🎙</span>
      <span class="cam-name" data-field="name">Your cool name</span>
    </div>
  </div>

  <!-- ===================== CHAT ===================== -->
  <!-- Messages appear here and auto-disappear after a few seconds. -->
  <div id="chat-wrap">
    <div id="chat-list"></div>
  </div>

  <!-- ===================== ALERTS (followers / bits / subs / etc) ===== -->
  <div id="alert-box">
    <div class="alert-inner">
      <div class="alert-lights">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="alert-badge" id="alert-badge">★</div>
      <div class="alert-text">
        <div class="alert-title" id="alert-title"></div>
        <div class="alert-sub" id="alert-sub"></div>
      </div>
    </div>
  </div>

  <!-- scene-transition --><div class="sx" aria-hidden="true" style="--sx-a:var(--gold);--sx-b:var(--stage-mid);--sx-c:var(--gold-hot)"><div class="sx-in"><i class="sx-cur l" style="--d:.5s"></i><i class="sx-cur r" style="--d:.5s"></i><b class="sx-name" data-field="name">Your cool name</b></div></div><!-- /scene-transition -->
</div><script>/* ===================================================================
   THE CHOICER VOICER — StreamElements Overlay  (JS tab)

   Handles:
     • Chat  (auto-disappears; mod deletions and bans remove messages)
     • Followers
     • Subscriptions (new / resub / gift / community gift)
     • Cheers (bits)
     • Raids
     • Tips (donations, shown in your StreamElements currency)

   No extra fields required. These optional Fields are supported; paste
   this into the widget's "Fields" tab if you want them editable in the
   StreamElements UI (otherwise the defaults in CFG below are used):

   {
     "chatLife":      { "type": "number", "label": "Chat seconds on screen", "value": 8 },
     "alertDuration": { "type": "number", "label": "Alert seconds on screen", "value": 6 },
     "minBits":       { "type": "number", "label": "Minimum bits to alert",  "value": 1 },
     "minTip":        { "type": "number", "label": "Minimum tip to alert",   "value": 1 }
   }
   ================================================================= */

/* ---------- config (filled from Fields if present) ---------- */
const CFG = {
  chatLife: 8,          // seconds a chat message stays
  alertDuration: 6,     // seconds an alert stays on screen
  minBits: 1,
  minTip: 1,
  maxAlertsQueued: 50,  // oldest queued alerts are dropped beyond this
  hideCommands: true,   // hide chat messages starting with !
  hiddenUsers: ['streamelements', 'nightbot', 'moobot', 'fossabot'] // lowercase
};
let currency = 'USD';   // replaced by your StreamElements currency on load

/* ---------- element refs ---------- */
const chatList   = document.getElementById('chat-list');
const alertBox   = document.getElementById('alert-box');
const alertBadge = document.getElementById('alert-badge');
const alertTitle = document.getElementById('alert-title');
const alertSub   = document.getElementById('alert-sub');

/* ---------- small helpers ---------- */
const num = v => (Number.isFinite(Number(v)) ? Math.max(0, Number(v)) : 0);
const str = v => (v == null ? '' : String(v));
function money(amount){
  try { return new Intl.NumberFormat(undefined, { style:'currency', currency }).format(num(amount)); }
  catch { return num(amount).toFixed(2); }
}
function cleanTier(tier){
  const t = str(tier).toLowerCase();
  if (t === 'prime') return 'Prime';
  return { '1000':'1', '2000':'2', '3000':'3' }[t] || '1';
}
/* Parts are [text] or [text, true] (highlighted). Built with text nodes,
   so names and messages can never be interpreted as HTML. */
function fill(el, parts){
  el.replaceChildren();
  for (const [text, hl] of parts){
    if (hl){ const s = document.createElement('span'); s.className = 'hl'; s.textContent = text; el.append(s); }
    else el.append(document.createTextNode(text));
  }
}

/* ---------- alert queue (so alerts don't overlap) ---------- */
const alertQueue = [];
let alertBusy = false, showTimer = null, hideTimer = null;

function enqueueAlert(badge, title, sub){
  if (alertQueue.length >= CFG.maxAlertsQueued) alertQueue.shift();
  alertQueue.push({ badge, title, sub });
  if (!alertBusy) runQueue();
}

function runQueue(){
  if (alertQueue.length === 0){ alertBusy = false; return; }
  alertBusy = true;
  const { badge, title, sub } = alertQueue.shift();
  alertBadge.textContent = badge;
  fill(alertTitle, title);
  fill(alertSub, sub);
  alertBox.classList.remove('hide');
  alertBox.classList.add('show');
  showTimer = setTimeout(endAlert, CFG.alertDuration * 1000);
}

function endAlert(){
  clearTimeout(showTimer); clearTimeout(hideTimer);
  if (!alertBusy) return;
  alertBox.classList.remove('show');
  alertBox.classList.add('hide');
  hideTimer = setTimeout(() => {
    alertBox.classList.remove('hide');
    runQueue();                 // next in line
  }, 500);                      // matches alertOut duration
}

/* ===================================================================
   CHAT — built entirely with DOM nodes; removed after it fades.
   ================================================================= */
function addChatMessage(data = {}){
  const nick = str(data.displayName || data.nick || 'chatter');
  const text = str(data.text).slice(0, 500);
  if (!text) return;
  if (CFG.hiddenUsers.includes(str(data.nick || nick).toLowerCase())) return;
  if (CFG.hideCommands && text.startsWith('!')) return;

  const msg = document.createElement('div');
  msg.className = 'chat-msg';
  msg.dataset.msgId  = str(data.msgId || data.tags?.id);
  msg.dataset.userId = str(data.userId || data.tags?.['user-id']);

  const user = document.createElement('span');
  user.className = 'chat-user';
  if (/^#[0-9a-f]{3,8}$/i.test(str(data.displayColor))) user.style.color = data.displayColor;

  const badges = Array.isArray(data.badges) ? data.badges : [];
  const safeBadges = badges.filter(b => /^https:\/\//i.test(str(b && b.url)));
  if (safeBadges.length){
    const wrap = document.createElement('span');
    wrap.className = 'chat-badges';
    for (const b of safeBadges){
      const img = document.createElement('img');
      img.src = b.url; img.alt = ''; img.referrerPolicy = 'no-referrer';
      img.onerror = () => img.remove();
      wrap.append(img);
    }
    user.append(wrap);
  }
  user.append(document.createTextNode(nick));

  const body = document.createElement('span');
  body.className = 'chat-text';
  renderEmotes(body, text, data.emotes);

  msg.append(user, body);
  chatList.appendChild(msg);

  // Remove after entrance + life + fade so the DOM stays clean
  msg._timer = setTimeout(() => msg.remove(), CFG.chatLife * 1000 + 1200);

  // Safety cap: never keep more than 30 nodes
  while (chatList.children.length > 30) removeMsg(chatList.firstElementChild);
}

function removeMsg(node){ clearTimeout(node._timer); node.remove(); }

/* Emotes are placed by their start/end positions from StreamElements,
   so an emote name inside another word or another emote is never touched. */
function renderEmotes(el, text, emotes){
  const list = (Array.isArray(emotes) ? emotes : [])
    .map(e => ({ start:Number(e.start), end:Number(e.end), name:str(e.name),
                 url: str((e.urls && (e.urls['4'] || e.urls['2'] || e.urls['1'])) || e.gif) }))
    .filter(e => Number.isInteger(e.start) && Number.isInteger(e.end) && e.end >= e.start && e.end < text.length && /^https:\/\//i.test(e.url))
    .sort((a, b) => a.start - b.start);
  let cursor = 0;
  for (const e of list){
    if (e.start < cursor) continue;               // overlapping data: skip
    el.append(document.createTextNode(text.slice(cursor, e.start)));
    const img = document.createElement('img');
    img.className = 'emote'; img.src = e.url; img.alt = text.slice(e.start, e.end + 1);
    img.referrerPolicy = 'no-referrer';
    img.onerror = () => img.replaceWith(document.createTextNode(img.alt));
    el.append(img);
    cursor = e.end + 1;
  }
  el.append(document.createTextNode(text.slice(cursor)));
}

/* ===================================================================
   STREAMELEMENTS EVENT LISTENERS
   ================================================================= */

// Load config from Fields (fired once on widget load)
window.addEventListener('onWidgetLoad', function (obj){
  const d = (obj && obj.detail) || {};
  const f = d.fieldData || {};
  const pos = (v, fallback) => (Number.isFinite(Number(v)) && Number(v) > 0 ? Number(v) : fallback);
  CFG.chatLife      = pos(f.chatLife, CFG.chatLife);
  CFG.alertDuration = pos(f.alertDuration, CFG.alertDuration);
  if (f.minBits != null) CFG.minBits = num(f.minBits);
  if (f.minTip  != null) CFG.minTip  = num(f.minTip);
  if (d.currency && d.currency.code) currency = d.currency.code;

  // keep the CSS chat lifetime in sync with the field value
  document.documentElement.style.setProperty('--chat-life', CFG.chatLife + 's');
});

// Main event stream
window.addEventListener('onEventReceived', function (obj){
  const detail   = (obj && obj.detail) || {};
  const listener = detail.listener;
  const event    = detail.event || {};
  if (!listener) return;

  switch (listener){

    /* ---------- CHAT ---------- */
    case 'message':
      addChatMessage(event.data || {});
      break;

    case 'delete-message': {
      const id = str((event.data || event).msgId);
      if (id) [...chatList.children].filter(n => n.dataset.msgId === id).forEach(removeMsg);
      break;
    }
    case 'delete-messages': {
      const id = str((event.data || event).userId);
      if (id) [...chatList.children].filter(n => n.dataset.userId === id).forEach(removeMsg);
      break;
    }

    /* ---------- "Skip alert" button in the activity feed ---------- */
    case 'event:skip':
      endAlert();
      break;

    /* ---------- FOLLOWER ---------- */
    case 'follower-latest':
      enqueueAlert('❤',
        [['NEW '], ['FOLLOWER', true]],
        [[str(event.name) || 'Someone', true], [' joined the show!']]);
      break;

    /* ---------- SUBSCRIBER ---------- */
    case 'subscriber-latest': {
      // Community gift: one alert for the initial event, not one per recipient
      if (event.bulkGifted){
        enqueueAlert('🎁',
          [[str(event.sender || event.name) || 'Someone', true], [' GIFTED']],
          [[`${num(event.amount)} subs to the audience!`]]);
        break;
      }
      if (event.isCommunityGift || event.playedAsCommunityGift) break;
      // single gift
      if (event.gifted){
        enqueueAlert('🎁',
          [['GIFTED '], ['SUB', true]],
          [[`${str(event.sender) || 'Someone'} → `], [str(event.name) || 'Someone', true]]);
        break;
      }
      // resub
      if (num(event.amount) > 1){
        enqueueAlert('⭐',
          [[str(event.name) || 'Someone', true], [' RESUBBED']],
          [[`${num(event.amount)} months • Tier ${cleanTier(event.tier)}`]]);
        break;
      }
      // brand-new sub

    if (d.action === 'chat-line' && typeof d.text === 'string') { n++; emit('message', { data: { displayName: String(d.name || 'You').slice(0, 32), nick: 'you', text: d.text.slice(0, 300), displayColor: '#FFD166', msgId: 'demo' + n, userId: 'you', badges: [{ type: 'broadcaster', url: '' }], emotes: [] } }); }
  });
})();
</script></body></html>
